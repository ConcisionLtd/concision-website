<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Social preview render template</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #ffffff;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }

      .card {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 32px;
        box-sizing: border-box;
        height: 100%;
        padding: 0 96px;
      }

      .logo {
        width: 520px;
        height: auto;
      }

      .url {
        color: #6e6e73;
        font-size: 28px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="../../branding/concision-logo.svg" alt="" />
      <div class="url">concision.io</div>
    </div>
  </body>
</html>
